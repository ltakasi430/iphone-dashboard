<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pocket Desk – Galaxy Monitor</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background:#04070d;
    color:#e8f4f8;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  #bg {
    position:fixed; inset:0;
    background:url('iris-wallpaper-galaxy.jpg') no-repeat right center;
    background-size:cover;
    z-index:0;
  }
  #bgshade {
    position:fixed; inset:0; z-index:1;
    background:linear-gradient(90deg, rgba(3,8,16,.88) 0%, rgba(3,8,16,.72) 46%, rgba(3,8,16,.18) 78%, rgba(3,8,16,.05) 100%);
  }
  #nightdim {
    position:fixed; inset:0; z-index:3; background:#000; opacity:0;
    pointer-events:none; transition:opacity 2s;
  }
  body.night #nightdim { opacity:.38; }
  body.night #bg { filter:brightness(.75); }

  #shift { position:relative; z-index:2; height:100%; transition:transform 1.2s ease; }
  #layout {
    display:flex; gap:1.6vw; height:100%;
    padding:2.2vh 2.2vw;
  }
  #left { flex:0 0 55%; display:flex; flex-direction:column; gap:1.8vh; min-width:0; }
  #right { flex:1; display:flex; flex-direction:column; gap:1.8vh; min-width:0; }

  /* clock */
  #clockbox { padding:0.4vh 0.4vw; }
  #clock {
    font-size:19vh; line-height:1; font-weight:200; letter-spacing:.01em;
    color:#f4fbff; text-shadow:0 2px 18px rgba(0,229,255,.25);
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  #clock .colon { display:inline-block; }
  #clock .colon.off { opacity:.15; }
  #dateline { margin-top:0.8vh; font-size:3.4vh; color:#bfe9f5; }
  #dateline .dow { color:#41d9ee; margin-left:.5em; }
  #weather { margin-top:0.4vh; font-size:3vh; color:#9fd8e8; }
  #weather .temp { color:#fff; font-size:3.6vh; }

  /* panels */
  .panel {
    background:rgba(6,18,30,.62);
    border:1px solid rgba(65,217,238,.28);
    border-radius:1.4vh;
    padding:1.5vh 1.2vw;
    backdrop-filter: blur(2px);
  }
  .panel h2 {
    font-size:2.5vh; font-weight:600; color:#41d9ee; letter-spacing:.12em;
    margin-bottom:1vh; display:flex; align-items:center; gap:.6em;
  }
  .panel h2 .sub { margin-left:auto; font-size:2vh; color:#8fb8c4; letter-spacing:0; font-weight:400; }

  .bigpct { display:flex; align-items:baseline; gap:1vw; }
  .bigpct .num { font-size:7.2vh; font-weight:200; color:#fff; line-height:1; }
  .bigpct .lbl { font-size:2.4vh; color:#bfe9f5; }
  .bar { height:1.1vh; border-radius:.6vh; background:rgba(255,255,255,.12); margin:1vh 0 .6vh; overflow:hidden; }
  .bar > i { display:block; height:100%; background:linear-gradient(90deg,#1899b2,#41d9ee); border-radius:.6vh; }
  .bar.warn > i { background:linear-gradient(90deg,#b26a18,#eeb041); }
  .bar.bad > i { background:linear-gradient(90deg,#b21818,#ee4141); }
  .kv { display:flex; justify-content:space-between; font-size:2.3vh; color:#cfeef7; padding:.35vh 0; }
  .kv b { color:#fff; font-weight:600; font-variant-numeric:tabular-nums; }
  .na { color:#6f8b96; }

  .qrow { display:flex; align-items:center; gap:.8vw; padding:.5vh 0; font-size:2.3vh; }
  .qrow .name { flex:0 0 34%; color:#cfeef7; }
  .qrow .bar { flex:1; margin:0; }
  .qrow .val { flex:0 0 18%; text-align:right; color:#fff; font-variant-numeric:tabular-nums; }

  .dot { display:inline-block; width:1.4vh; height:1.4vh; border-radius:50%; background:#5a6d75; vertical-align:middle; }
  .dot.ok { background:#39e08c; box-shadow:0 0 8px rgba(57,224,140,.8); }
  .dot.warn { background:#eeb041; box-shadow:0 0 8px rgba(238,176,65,.8); }
  .dot.error { background:#ee4141; box-shadow:0 0 8px rgba(238,65,65,.8); }
  #devlines { font-size:2.35vh; line-height:1.5; color:#e6f6fb; }
  #devlines div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #devdetail { font-size:2.1vh; color:#9fd8e8; margin-bottom:.6vh; }

  /* calendar */
  #cal table { width:100%; border-collapse:collapse; font-size:2.2vh; text-align:center; }
  #cal th { color:#41d9ee; font-weight:600; padding:.3vh 0; }
  #cal td { color:#d7edf4; padding:.32vh 0; font-variant-numeric:tabular-nums; }
  #cal td.today { background:rgba(65,217,238,.28); border-radius:50%; color:#fff; font-weight:700; }
  #cal td.dim { color:#55707b; }
  #cal td.sun { color:#f0a3a3; } #cal td.sat { color:#a3c8f0; }

  #footer {
    margin-top:auto; display:flex; justify-content:space-between; align-items:baseline;
    font-size:1.9vh; color:#7fa6b3; padding:0 .4vw;
  }
  #footer a { color:#7fa6b3; text-decoration:none; }

  #spacer-iris { flex:1; min-height:6vh; }

  @media (orientation: portrait) {
    #layout { flex-direction:column; overflow-y:auto; }
    #left, #right { flex:none; }
    #clock { font-size:16vw; }
    .bigpct .num { font-size:12vw; }
  }
</style>
</head>
<body>
<div id="bg"></div>
<div id="bgshade"></div>
<div id="nightdim"></div>

<div id="shift">
  <div id="layout">
    <div id="left">
      <div id="clockbox">
        <div id="clock">--<span class="colon" id="colon">:</span>--</div>
        <div id="dateline"><span id="date">----/--/--</span><span class="dow" id="dow"></span></div>
        <div id="weather">京都 <span class="temp" id="wtemp">--°</span> <span id="wdesc">取得中…</span></div>
      </div>

      <div class="panel" id="claude-panel">
        <h2>Muse <span class="sub" id="claude-plan">Power</span></h2>
        <div class="bigpct"><span class="num" id="claude-pct">--%</span><span class="lbl">週間枠の残り</span></div>
        <div class="bar" id="claude-bar"><i style="width:0%"></i></div>
        <div class="kv"><span>リセット</span><b id="claude-reset">—</b></div>
        <div class="kv"><span>追加トークンプール</span><b id="claude-pool">—</b></div>
      </div>

      <div class="panel" id="quota-panel">
        <h2>AI利用枠 <span class="sub">Codex / API / Gemini / Modal</span></h2>
        <div id="quotas"></div>
      </div>
    </div>

    <div id="right">
      <div id="spacer-iris"></div>
      <div class="panel" id="dev-panel">
        <h2><span class="dot" id="dev-dot"></span>Coneco 開発状況 <span class="sub" id="dev-updated"></span></h2>
        <div id="devdetail">未接続</div>
        <div id="devlines"></div>
      </div>
      <div class="panel" id="cal">
        <h2 id="cal-title">カレンダー</h2>
        <div id="cal-body"></div>
      </div>
      <div id="footer">
        <span>Pocket Desk – Galaxy Monitor</span>
        <span>データ更新 <span id="updated">—</span> ／ <a href="iphone.html">iPhone版</a> ・ <a href="classic.html">旧画面</a></span>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var DOW = ["日","月","火","水","木","金","土"];

  /* ---------- clock ---------- */
  function pad(n){ return (n<10?"0":"")+n; }
  function tickClock(){
    var now = new Date();
    var h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
    $("clock").firstChild.nodeValue = pad(h);
    $("clock").lastChild.nodeValue = pad(m);
    $("colon").className = "colon" + (s % 2 ? " off" : "");
    $("date").textContent = now.getFullYear() + "/" + pad(now.getMonth()+1) + "/" + pad(now.getDate());
    $("dow").textContent = "(" + DOW[now.getDay()] + ")";
    document.body.className = (h >= 23 || h < 6) ? "night" : "";
  }

  /* ---------- calendar ---------- */
  function buildCal(){
    var now = new Date(), y = now.getFullYear(), mo = now.getMonth(), today = now.getDate();
    $("cal-title").textContent = y + "年" + (mo+1) + "月";
    var first = new Date(y, mo, 1).getDay();
    var days = new Date(y, mo+1, 0).getDate();
    var html = "<table><tr><th>日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th>土</th></tr><tr>";
    var i, cell = 0;
    for (i=0;i<first;i++){ html += "<td></td>"; cell++; }
    for (var d=1; d<=days; d++){
      var dow = (first + d - 1) % 7;
      var cls = (d===today) ? "today" : (dow===0 ? "sun" : (dow===6 ? "sat" : ""));
      html += '<td class="' + cls + '">' + d + "</td>"; cell++;
      if (cell % 7 === 0 && d < days) html += "</tr><tr>";
    }
    html += "</tr></table>";
    $("cal-body").innerHTML = html;
  }

  /* ---------- weather (Kyoto, Open-Meteo) ---------- */
  var WDESC = {0:"快晴",1:"晴れ",2:"一部曇り",3:"曇り",45:"霧",48:"霧",51:"小雨",53:"小雨",55:"小雨",61:"雨",63:"雨",65:"大雨",71:"雪",73:"雪",75:"大雪",80:"にわか雨",81:"にわか雨",82:"激しいにわか雨",95:"雷雨"};
  function fetchWeather(){
    var url = "https://api.open-meteo.com/v1/forecast?latitude=35.0116&longitude=135.7681&current=temperature_2m,weather_code&timezone=Asia%2FTokyo";
    fetch(url).then(function(r){ return r.json(); }).then(function(j){
      if (j && j.current){
        $("wtemp").textContent = Math.round(j.current.temperature_2m) + "°";
        $("wdesc").textContent = WDESC[j.current.weather_code] || "";
      }
    }).catch(function(){ /* keep last values */ });
  }

  /* ---------- monitor.json ---------- */
  function fmtDateTime(iso){
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "—";
    return (d.getMonth()+1) + "/" + d.getDate() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function barClass(pct){ return pct <= 15 ? "bar bad" : (pct <= 35 ? "bar warn" : "bar"); }
  function qrow(name, pct, valText){
    var right = (valText !== null && valText !== undefined) ? valText
              : (pct !== null && pct !== undefined) ? pct + "%"
              : '<span class="na">未取得</span>';
    var bar = (pct !== null && pct !== undefined)
      ? '<div class="' + barClass(pct) + '"><i style="width:' + pct + '%"></i></div>'
      : '<div class="bar"><i style="width:0%"></i></div>';
    return '<div class="qrow"><span class="name">' + name + '</span>' + bar +
           '<span class="val">' + right + '</span></div>';
  }
  function usd(v){ return (v === null || v === undefined) ? null : "$" + Number(v).toFixed(2); }

  function renderMonitor(j){
    if (!j) return;
    $("updated").textContent = fmtDateTime(j.updated_at);

    var mu = j.muse || {};
    if (mu.weekly_remaining_pct !== null && mu.weekly_remaining_pct !== undefined){
      $("claude-pct").textContent = mu.weekly_remaining_pct + "%";
      var b = $("claude-bar"); b.className = barClass(mu.weekly_remaining_pct);
      b.firstChild.style.width = mu.weekly_remaining_pct + "%";
    } else { $("claude-pct").innerHTML = '<span class="na">未取得</span>'; }
    if (mu.plan) $("claude-plan").textContent = mu.plan;
    $("claude-reset").textContent = fmtDateTime(mu.weekly_reset_at);
    $("claude-pool").textContent = mu.extra_pool_left || "—";

    var rows = "";
    var cx = j.codex || {};
    rows += qrow("Codex 5時間", cx.five_hour_remaining_pct);
    rows += qrow("Codex 週間", cx.weekly_remaining_pct);
    var oa = j.openai || {};
    rows += qrow("OpenAI API", null, usd(oa.credit_remaining_usd));
    var gm = j.gemini || {};
    rows += qrow("Gemini", gm.remaining_pct);
    var md = j.modal || {};
    rows += qrow("Modal", null, usd(md.credit_remaining_usd));
    $("quotas").innerHTML = rows;

    var sv = (j.services || {}).coneco || {};
    var dot = $("dev-dot");
    dot.className = "dot " + (sv.status === "ok" ? "ok" : sv.status === "warn" ? "warn" : sv.status === "error" ? "error" : "");
    $("devdetail").textContent = sv.detail || "未接続";
    var lines = sv.lines || [];
    var html = "";
    for (var i=0;i<lines.length;i++) html += "<div>" + lines[i] + "</div>";
    $("devlines").innerHTML = html;
    $("dev-updated").textContent = fmtDateTime(j.updated_at) + " 時点";
  }

  function fetchMonitor(){
    fetch("monitor.json?t=" + Date.now()).then(function(r){
      if (!r.ok) throw new Error("not ok");
      return r.json();
    }).then(renderMonitor).catch(function(){ /* 未接続表示のまま */ });
  }

  /* ---------- burn-in countermeasures ---------- */
  var SHIFTS = [[0,0],[3,2],[-3,2],[2,-3],[-2,-3],[0,3],[3,-2],[-3,-2]];
  var shiftIdx = 0;
  function pixelShift(){
    shiftIdx = (shiftIdx + 1) % SHIFTS.length;
    var s = SHIFTS[shiftIdx];
    $("shift").style.transform = "translate(" + s[0] + "px," + s[1] + "px)";
  }

  /* ---------- start ---------- */
  tickClock(); buildCal(); fetchWeather(); fetchMonitor();
  setInterval(tickClock, 1000);
  setInterval(buildCal, 60000);
  setInterval(fetchWeather, 15 * 60 * 1000);
  setInterval(fetchMonitor, 5 * 60 * 1000);
  setInterval(pixelShift, 60 * 1000);
})();
</script>
</body>
</html>

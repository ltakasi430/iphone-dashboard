<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pocket Desk – Galaxy Monitor</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background:#050b12;
    color:#eefaff;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  #nightdim {
    position:fixed; inset:0; z-index:3; background:#000; opacity:0;
    pointer-events:none; transition:opacity 2s;
  }
  body.night #nightdim { opacity:.38; }

  #shift { position:relative; z-index:2; height:100%; transition:transform 1.2s ease; }
  #layout {
    display:flex; gap:1.6vw; height:100%;
    padding:1.9vh 2.2vw;
  }
  #left { flex:0 0 37.5%; display:flex; flex-direction:column; gap:1.5vh; min-width:0; }
  #right { flex:1; display:flex; flex-direction:column; gap:1.15vh; min-width:0; margin-left:1.2vw; }

  /* clock */
  #clockbox { padding:0.4vh 0.4vw; display:flex; align-items:flex-start; gap:1.6vw; }
  #clockmain { flex:0 1 auto; min-width:0; }
  #battery { margin-top:0.5vh; font-size:3.1vh; color:#c4ecf7; display:none; align-items:center; gap:.55em; }
  #battery .bbar { display:inline-block; width:9vh; height:1.7vh; border:1px solid rgba(94,231,250,.55); border-radius:.45vh; overflow:hidden; }
  #battery .bbar i { display:block; height:100%; background:#41d9ee; }
  #battery #bpct { color:#fff; font-variant-numeric:tabular-nums; }
  #battery #bstate { font-size:2.5vh; color:#8fd8e8; }
  #analog { width:19vh; height:19vh; flex:none; margin-top:.6vh; transform:translateX(1.5vw); }
  #analog .aface { fill:rgba(10,24,38,.7); stroke:rgba(65,217,238,.55); stroke-width:1.6; }
  #analog .ahand { stroke-linecap:round; }
  #analog .hh { stroke:#eefaff; stroke-width:4.4; }
  #analog .mh { stroke:#bfefff; stroke-width:3; }
  #analog .sh { stroke:#22d3ee; stroke-width:1.6; }
  #analog .acenter { fill:#22d3ee; }
  #clock {
    font-size:17vh; line-height:1; font-weight:200; letter-spacing:.01em;
    color:#ffffff; text-shadow:0 2px 18px rgba(0,229,255,.25);
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  #clock .colon { display:inline-block; transform:translateY(-.15em); }
  #clock .colon.off { opacity:.15; }
  #dateline { margin-top:0.8vh; font-size:3.5vh; color:#d8f6ff; }
  #dateline .dow { color:#41d9ee; margin-left:.5em; }
  #weather { margin-top:0.4vh; font-size:3.1vh; color:#c4ecf7; }
  #weather .temp { color:#fff; font-size:3.7vh; }
  #weather #whilo { font-size:2.5vh; color:#8fb8c4; margin-left:.6em; }

  /* panels */
  .panel {
    background:rgba(10,24,38,.7);
    border:1px solid rgba(65,217,238,.5);
    border-radius:1.4vh;
    padding:1.4vh 1.2vw;
  }
  .panel h2 {
    font-size:2.6vh; font-weight:600; color:#5ee7fa; letter-spacing:.12em;
    margin-bottom:1vh; display:flex; align-items:center; gap:.6em;
  }
  .panel h2 .sub { margin-left:auto; font-size:2.15vh; color:#a9cfdb; letter-spacing:0; font-weight:400; }

  .bigpct { display:flex; align-items:baseline; gap:1vw; }
  .bigpct .num { font-size:7.2vh; font-weight:200; color:#fff; line-height:1; }
  .bigpct .lbl { font-size:2.6vh; color:#d8f6ff; }
  .bar { height:1.2vh; border-radius:.6vh; background:rgba(255,255,255,.16); margin:1vh 0 .6vh; overflow:hidden; }
  .bar > i { display:block; height:100%; background:linear-gradient(90deg,#1899b2,#41d9ee); border-radius:.6vh; }
  .bar.warn > i { background:linear-gradient(90deg,#b26a18,#eeb041); }
  .bar.bad > i { background:linear-gradient(90deg,#b21818,#ee4141); }
  .kv { display:flex; justify-content:space-between; font-size:2.45vh; color:#e2f7ff; padding:.35vh 0; }
  .kv b { color:#fff; font-weight:600; font-variant-numeric:tabular-nums; }
  .kv .pace { color:#a9cfdb; font-size:2.1vh; margin-left:.7em; }
  .na { color:#93aeba; }

  #refresh-btn { display:block; width:100%; margin-top:1vh; padding:.9vh 0 .2vh; background:none; border:none; border-top:1px solid rgba(94,231,250,.22); font-size:2.1vh; font-weight:400; letter-spacing:.34em; text-indent:.34em; color:#8fd8e8; cursor:pointer; text-align:center; transition:color .25s; } #refresh-btn::before { content:"⟳"; margin-right:.55em; font-size:2.3vh; color:#5ee7fa; } #refresh-btn:hover { color:#eafcff; } #refresh-btn:disabled { opacity:.5; cursor:wait; } #refresh-status { min-height:2.2vh; margin-top:.3vh; font-size:1.9vh; color:#ffb3b3; text-align:center; } .qrow { display:flex; align-items:center; gap:.8vw; padding:.45vh 0; font-size:2.45vh; }
  .qrow .name { flex:0 0 34%; color:#e2f7ff; }
  .qrow .bar { flex:1; margin:0; }
  .qrow .val { flex:0 0 18%; text-align:right; color:#fff; font-variant-numeric:tabular-nums; }

  .dot { display:inline-block; width:1.5vh; height:1.5vh; border-radius:50%; background:#5a6d75; vertical-align:middle; }
  .dot.ok { background:#39e08c; box-shadow:0 0 8px rgba(57,224,140,.8); }
  .dot.warn { background:#eeb041; box-shadow:0 0 8px rgba(238,176,65,.8); }
  .dot.error { background:#ee4141; box-shadow:0 0 8px rgba(238,65,65,.8); }
  #dev-panel { padding:1.2vh 1.2vw; flex:1; display:flex; flex-direction:column; }
  #dev-panel h2 { font-size:3.9vh; }
  #dev-panel h2 .sub { font-size:2.7vh; }
  #devlines { font-size:4vh; line-height:1.55; color:#f0fbff; }
  #dev-panel #refresh-btn { font-size:2.9vh; }
  #refresh-btn { margin-top:auto; }
  #devlines div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #devdetail { font-size:2.25vh; color:#c4ecf7; margin-bottom:.5vh; }

  /* calendar */
  #cal { flex:0 0 auto; }
  #cal table { width:100%; border-collapse:collapse; font-size:3.1vh; text-align:center; }
  #cal th { color:#5ee7fa; font-weight:600; padding:.65vh 0; }
  #cal td { color:#e6f8ff; padding:.72vh 0; font-variant-numeric:tabular-nums; vertical-align:top; }
  #cal .dnum { display:inline-flex; align-items:center; justify-content:center; min-width:5vh; height:5vh; border-radius:50%; }
  #cal td.today .dnum { background:rgba(65,217,238,.52); color:#fff; font-weight:700; box-shadow:0 0 12px rgba(65,217,238,.5), inset 0 0 0 1.5px rgba(160,240,255,.75); }
  #cal td.dim { color:#55707b; }
  #cal td.sun { color:#ffb3b3; } #cal td.sat { color:#b3d4f0; }
  #cal td.hol .dnum { color:#ff8f9e; }

  /* wallpaper 全面背景 (アプリが Drive / 端末内フォルダから配信する画像。無い環境では出ない) */
  #bg { position:fixed; inset:0; z-index:0; overflow:hidden; }
  #bg img { width:100%; height:100%; object-fit:cover; display:block; opacity:0; transition:opacity .8s; filter:brightness(.48); }
  /* 次の壁紙へ (文字なし・右下の装飾ダイヤに偽装したボタン) */
  #wp-next { position:fixed; right:0.6vw; bottom:0.4vh; z-index:5; width:6.5vh; height:6.5vh; padding:0; background:transparent; border:none; cursor:pointer; display:none; -webkit-tap-highlight-color:transparent; }
  #wp-next::before { content:""; display:block; width:2.1vh; height:2.1vh; margin:auto; border:1px solid rgba(65,217,238,.45); background:rgba(65,217,238,.10); transform:rotate(45deg); box-shadow:0 0 6px rgba(65,217,238,.25); }

  #footer {
    margin-top:auto; display:flex; justify-content:space-between; align-items:baseline;
    font-size:2vh; color:#9dc3d1; padding:0 .4vw;
  }
  #footer a { color:#9dc3d1; text-decoration:none; }
  #footer span { white-space:nowrap; }

  @media (max-width:700px) {
    #clock { font-size:15vh; }
    #analog { width:16.5vh; height:16.5vh; transform:none; }
    #battery { font-size:2.8vh; gap:.4em; }
    #battery .bbar { width:7.5vh; }
    #battery #bpct { white-space:nowrap; }
    #battery #bstate { font-size:2.3vh; white-space:nowrap; }
  }
  @media (orientation: portrait) {
    #layout { flex-direction:column; overflow-y:auto; }
    #left, #right { flex:none; }
    #clock { font-size:16vw; }
    .bigpct .num { font-size:12vw; }
  }
</style>
</head>
<body>
<div id="bg"><img id="bg-img" alt=""></div>
<div id="nightdim"></div>

<div id="shift">
  <div id="layout">
    <div id="left">
      <div id="clockbox">
        <div id="clockmain">
          <div id="clock">--<span class="colon" id="colon">:</span>--</div>
          <div id="dateline"><span id="date">----/--/--</span><span class="dow" id="dow"></span></div>
          <div id="weather">京都 <span class="temp" id="wtemp">--°</span> <span id="wdesc">取得中…</span><span id="whilo"></span></div>
          <div id="battery">バッテリー <span class="bbar"><i id="bfill" style="width:0%"></i></span> <span id="bpct">--%</span> <span id="bstate"></span></div>
        </div>
        <svg id="analog" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="aface" cx="50" cy="50" r="47"></circle>
          <g id="aticks"></g>
          <line id="ahour" class="ahand hh" x1="50" y1="50" x2="50" y2="31"></line>
          <line id="amin" class="ahand mh" x1="50" y1="50" x2="50" y2="21"></line>
          <line id="asec" class="ahand sh" x1="50" y1="57" x2="50" y2="13"></line>
          <circle class="acenter" cx="50" cy="50" r="2.6"></circle>
        </svg>
      </div>

      <div class="panel" id="claude-panel">
        <h2>Muse <span class="sub" id="claude-plan">Power</span></h2>
        <div class="bigpct"><span class="num" id="claude-pct">--%</span><span class="lbl">週間枠の残り</span></div>
        <div class="bar" id="claude-bar"><i style="width:0%"></i></div>
        <div class="kv"><span>リセット</span><span><b id="claude-reset">—</b><span class="pace" id="claude-pace"></span></span></div>
      </div>

      <div class="panel" id="quota-panel">
        <h2>OpenCode Go <span class="sub" id="go-status">週間プール</span></h2>
        <div class="bigpct"><span class="num" id="go-pct">--%</span><span class="lbl">週間プールの残り</span></div>
        <div class="bar" id="go-bar"><i style="width:0%"></i></div>
        <div class="kv"><span>リセット</span><span><b id="go-reset">—</b><span class="pace" id="go-pace"></span></span></div>
        <div class="kv"><span>月間の使用率</span><span><b id="go-monthly">—</b><span class="pace" id="go-monthly-reset"></span></span></div>
        <div class="kv"><span>直近の使用率</span><span><b id="go-rolling">—</b><span class="pace" id="go-rolling-reset"></span></span></div>
      </div>
    </div>

    <div id="right">
      <div class="panel" id="cal">
        <h2 id="cal-title">カレンダー</h2>
        <div id="cal-body"></div>
      </div>

      <div class="panel" id="dev-panel">
        <h2>開発状況 <span class="dot" id="dev-dot"></span><span class="sub" id="dev-sub"></span></h2>
        <div id="devdetail">未接続</div>
        <div id="devlines"></div>
        <button id="refresh-btn" type="button">最新に更新</button>
        <div id="refresh-status" role="status" aria-live="polite"></div>
      </div>

      <div id="footer">
        <span>Pocket Desk – Galaxy Monitor</span>
        <span>データ更新 <span id="updated">—</span></span>
      </div>
    </div>
  </div>
</div>
<button id="wp-next" aria-label="次の壁紙"></button>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var DOW = ["日","月","火","水","木","金","土"];

  /* ---------- clock ---------- */
  function pad(n){ return (n<10?"0":"")+n; }
  function tickClock(){
    var now = new Date();
    var h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
    $("clock").firstChild.nodeValue = pad(h);
    $("clock").lastChild.nodeValue = pad(m);
    $("colon").className = "colon" + (s % 2 ? " off" : "");
    $("date").textContent = now.getFullYear() + "/" + pad(now.getMonth()+1) + "/" + pad(now.getDate());
    $("dow").textContent = "(" + DOW[now.getDay()] + ")";
    document.body.className = (h >= 23 || h < 6) ? "night" : "";
  }
  /* 秒の境界に合わせて更新する (setInterval の累積ズレで点滅が不規則になるのを防ぐ) */
  function scheduleClock(){
    var delay = 1000 - (Date.now() % 1000) + 20;
    setTimeout(function(){ tickClock(); scheduleClock(); }, delay);
  }

  /* ---------- analog clock (smooth second hand) ---------- */
  (function buildTicks(){
    var html = "";
    for (var i=0;i<12;i++){
      var a = i * 30 * Math.PI / 180, big = (i % 3 === 0);
      var r1 = big ? 40 : 43, r2 = 45.5;
      html += '<line x1="' + (50 + r1 * Math.sin(a)).toFixed(1) + '" y1="' + (50 - r1 * Math.cos(a)).toFixed(1) +
              '" x2="' + (50 + r2 * Math.sin(a)).toFixed(1) + '" y2="' + (50 - r2 * Math.cos(a)).toFixed(1) +
              '" stroke="' + (big ? "#5ee7fa" : "rgba(148,197,214,.5)") + '" stroke-width="' + (big ? 2 : 1.1) + '"/>';
    }
    $("aticks").innerHTML = html;
  })();
  function updateAnalog(){
    var now = new Date();
    var s = now.getSeconds() + now.getMilliseconds() / 1000;
    var m = now.getMinutes() + s / 60;
    var h = (now.getHours() % 12) + m / 60;
    $("asec").setAttribute("transform", "rotate(" + (s * 6).toFixed(2) + " 50 50)");
    $("amin").setAttribute("transform", "rotate(" + (m * 6).toFixed(2) + " 50 50)");
    $("ahour").setAttribute("transform", "rotate(" + (h * 30).toFixed(2) + " 50 50)");
  }

  /* ---------- calendar ---------- */
  var HOLIDAYS = {};
  function fetchHolidays(){
    var y = new Date().getFullYear();
    fetch("https://holidays-jp.github.io/api/v1/" + y + "/date.json")
      .then(function(r){ return r.json(); })
      .then(function(j){ if (j){ HOLIDAYS = j; buildCal(); } })
      .catch(function(){});
  }
  function buildCal(){
    var now = new Date(), y = now.getFullYear(), mo = now.getMonth(), today = now.getDate();
    $("cal-title").textContent = y + "年" + (mo+1) + "月";
    var first = new Date(y, mo, 1).getDay();
    var days = new Date(y, mo+1, 0).getDate();
    var html = "<table><tr><th>日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th>土</th></tr><tr>";
    var i, cell = 0;
    for (i=0;i<first;i++){ html += "<td></td>"; cell++; }
    for (var d=1; d<=days; d++){
      var dow = (first + d - 1) % 7;
      var hname = HOLIDAYS[y + "-" + pad(mo+1) + "-" + pad(d)] || "";
      var cls = (d===today) ? "today" : (dow===0 ? "sun" : (dow===6 ? "sat" : ""));
      if (hname) cls = (cls ? cls + " " : "") + "hol";
      var inner = '<span class="dnum">' + d + "</span>";
      html += '<td class="' + cls + '">' + inner + "</td>"; cell++;
      if (cell % 7 === 0 && d < days) html += "</tr><tr>";
    }
    html += "</tr></table>";
    $("cal-body").innerHTML = html;
  }

  /* ---------- weather (Kyoto, Open-Meteo) ---------- */
  var WDESC = {0:"快晴",1:"晴れ",2:"一部曇り",3:"曇り",45:"霧",48:"霧",51:"小雨",53:"小雨",55:"小雨",61:"雨",63:"雨",65:"大雨",71:"雪",73:"雪",75:"大雪",80:"にわか雨",81:"にわか雨",82:"激しいにわか雨",95:"雷雨"};
  function fetchWeather(){
    var url = "https://api.open-meteo.com/v1/forecast?latitude=35.0116&longitude=135.7681&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&forecast_days=1&timezone=Asia%2FTokyo";
    fetch(url).then(function(r){ return r.json(); }).then(function(j){
      if (j && j.current){
        $("wtemp").textContent = Math.round(j.current.temperature_2m) + "°";
        $("wdesc").textContent = WDESC[j.current.weather_code] || "";
      }
      if (j && j.daily && j.daily.temperature_2m_max && j.daily.temperature_2m_max.length){
        $("whilo").textContent = "最高" + Math.round(j.daily.temperature_2m_max[0]) + "° / 最低" + Math.round(j.daily.temperature_2m_min[0]) + "°";
      }
    }).catch(function(){ /* keep last values */ });
  }

  /* ---------- battery (表示している端末自身の残量) ---------- */
  function initBattery(){
    if (!navigator.getBattery) return;
    navigator.getBattery().then(function(b){
      function upd(){
        var pct = Math.round(b.level * 100);
        $("battery").style.display = "flex";
        $("bpct").textContent = pct + "%";
        var f = $("bfill");
        f.style.width = pct + "%";
        f.style.background = pct <= 20 ? "#ee4141" : (pct <= 40 ? "#eeb041" : "#41d9ee");
        $("bstate").textContent = b.charging ? "充電中" : "";
      }
      b.addEventListener("levelchange", upd);
      b.addEventListener("chargingchange", upd);
      upd();
    }).catch(function(){});
  }

  /* ---------- monitor.json ---------- */
  function fmtDateTime(iso){
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "—";
    return (d.getMonth()+1) + "/" + d.getDate() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function barClass(pct){ return pct <= 15 ? "bar bad" : (pct <= 35 ? "bar warn" : "bar"); }
  function paceText(remainPct, resetIso){
    if (remainPct === null || remainPct === undefined || !resetIso) return "";
    var ms = Date.parse(resetIso) - Date.now();
    if (isNaN(ms) || ms <= 0) return "";
    var per = remainPct / (ms / 86400000);
    return "1日約" + (per >= 10 ? Math.round(per) : per.toFixed(1)) + "%ペース";
  }
  function qrow(name, pct, valText){
    var right = (valText !== null && valText !== undefined) ? valText
              : (pct !== null && pct !== undefined) ? pct + "%"
              : '<span class="na">未取得</span>';
    var bar = (pct !== null && pct !== undefined)
      ? '<div class="' + barClass(pct) + '"><i style="width:' + pct + '%"></i></div>'
      : '<div class="bar"><i style="width:0%"></i></div>';
    return '<div class="qrow"><span class="name">' + name + '</span>' + bar +
           '<span class="val">' + right + '</span></div>';
  }
  function usd(v){ return (v === null || v === undefined) ? null : "$" + Number(v).toFixed(2); }

  function renderMonitor(j){
    if (!j) return;
    $("updated").textContent = fmtDateTime((lastUpdatedAt = j.updated_at || lastUpdatedAt));

    var mu = j.muse || {};
    if (mu.weekly_remaining_pct !== null && mu.weekly_remaining_pct !== undefined){
      $("claude-pct").textContent = mu.weekly_remaining_pct + "%";
      var b = $("claude-bar"); b.className = barClass(mu.weekly_remaining_pct);
      b.firstChild.style.width = mu.weekly_remaining_pct + "%";
    } else { $("claude-pct").innerHTML = '<span class="na">未取得</span>'; }
    if (mu.plan) $("claude-plan").textContent = mu.plan;
    $("claude-reset").textContent = fmtDateTime(mu.weekly_reset_at);
    $("claude-pace").textContent = paceText(mu.weekly_remaining_pct, mu.weekly_reset_at);

    var go = j.opencode_go || {};
    if (go.weekly_used_pct !== null && go.weekly_used_pct !== undefined){
      var remain = 100 - go.weekly_used_pct;
      $("go-pct").textContent = remain + "%";
      var gb = $("go-bar"); gb.className = barClass(remain);
      gb.firstChild.style.width = remain + "%";
    } else { $("go-pct").innerHTML = '<span class="na">未取得</span>'; }
    $("go-status").textContent = go.weekly_status === "rate-limited" ? "週間プール（上限到達）" : "週間プール";
    $("go-reset").textContent = fmtDateTime(go.weekly_resets_at);
    $("go-pace").textContent = (go.weekly_used_pct !== null && go.weekly_used_pct !== undefined)
      ? paceText(100 - go.weekly_used_pct, go.weekly_resets_at) : "";
    $("go-monthly").textContent = (go.monthly_used_pct !== null && go.monthly_used_pct !== undefined) ? go.monthly_used_pct + "%" : "—";
    $("go-monthly-reset").textContent = go.monthly_resets_at ? "リセット " + fmtDateTime(go.monthly_resets_at) : "";
    $("go-rolling").textContent = (go.rolling_used_pct !== null && go.rolling_used_pct !== undefined) ? go.rolling_used_pct + "%" : "—";
    $("go-rolling-reset").textContent = go.rolling_resets_at ? "リセット " + fmtDateTime(go.rolling_resets_at) : "";



    var svc = (j.services || {}).coneco || {};
    var ddot = $("dev-dot");
    if (ddot) ddot.className = "dot" + (svc.status === "ok" ? " ok" : (svc.status === "warn" ? " warn" : ""));
    var dsub = $("dev-sub");
    if (dsub) dsub.textContent = svc.status === "ok" ? "稼働中" : (svc.status === "warn" ? "要確認" : "");
    var ddet = $("devdetail");
    if (ddet) ddet.textContent = svc.detail || "未接続";
    var dlines = $("devlines");
    if (dlines) {
      dlines.innerHTML = "";
      (svc.lines || []).forEach(function(line){
        var d = document.createElement("div");
        d.textContent = line;
        dlines.appendChild(d);
      });
    }
  }

  var MONITOR_URL = "https://pocketdesk-monitor.hasse430.workers.dev/monitor.json"; var REFRESH_URL = "https://pocketdesk-monitor.hasse430.workers.dev/refresh"; var lastUpdatedAt = null; var refreshing = false; var REFRESH_TIMEOUT_MS = 90000; var REFRESH_POLL_MS = 5000;
  function fetchMonitor(){
    fetch(MONITOR_URL + "?t=" + Date.now()).then(function(r){
      if (!r.ok) throw new Error("not ok");
      return r.json();
    }).then(renderMonitor).catch(function(){
      fetch("monitor.json?t=" + Date.now()).then(function(r){
        if (!r.ok) throw new Error("not ok");
        return r.json();
      }).then(renderMonitor).catch(function(){ /* 未接続表示のまま */ });
    });
  }

  /* ---------- burn-in countermeasures ---------- */
  var SHIFTS = [[0,0],[3,2],[-3,2],[2,-3],[-2,-3],[0,3],[3,-2],[-3,-2]];
  var shiftIdx = 0;
  function pixelShift(){
    shiftIdx = (shiftIdx + 1) % SHIFTS.length;
    var s = SHIFTS[shiftIdx];
    $("shift").style.transform = "translate(" + s[0] + "px," + s[1] + "px)";
  }

  /* ---------- wallpaper (Android アプリが端末内フォルダの画像を配信する) ---------- */
  var WP_BASE = "https://pocketdesk.local/wallpaper/";
  var wpList = [], wpIdx = 0, wpOff = false;
  function wpApply(){ $("bg-img").style.opacity = wpOff ? "0" : "1"; }
  function wpShow(i){
    if (!wpList.length) return;
    wpIdx = ((i % wpList.length) + wpList.length) % wpList.length;
    var url = WP_BASE + encodeURIComponent(wpList[wpIdx]);
    var img = $("bg-img");
    if (img.getAttribute("src") === url){ wpApply(); return; }
    /* 先に読み込んでから差し替える (Drive 取得時は数秒かかるので空白を作らない) */
    var pre = new Image();
    pre.onload = function(){ img.src = url; wpApply(); };
    pre.src = url;
  }
  function initWallpaper(){
    fetch(WP_BASE + "list.json").then(function(r){ if (!r.ok) throw new Error("no wp"); return r.json(); })
    .then(function(list){
      if (!list || !list.length){ wpList = []; return; }
      var first = !wpList.length;
      wpList = list;
      $("wp-next").style.display = wpList.length > 1 ? "block" : "none";
      if (first) wpShow(0);
    }).catch(function(){});
  }
  $("bg-img").addEventListener("load", wpApply);
  /* 背景のタップで表示/非表示 (ボタンやリンクのタップでは切り替えない) */
  document.addEventListener("click", function(e){
    if (e.target.closest && e.target.closest("button, a")) return;
    if (!wpList.length) return;
    wpOff = !wpOff; wpApply();
  });

  /* ---------- start ---------- */ function isNewerUpdatedAt(v, before) { if(!v) return false; if(!before) return true; var a = Date.parse(v), b = Date.parse(before); if(!isNaN(a) && !isNaN(b)) return a > b; return v > before; } function requestRefresh() { if(refreshing) return; var btn = $("refresh-btn"), status = $("refresh-status"); if(!btn) return; refreshing = true; btn.disabled = true; btn.textContent = "更新中…"; if(status) status.textContent = ""; var before = lastUpdatedAt, startedAt = Date.now(); function finish(ok) { if(!ok && status) status.textContent = "更新できませんでした"; refreshing = false; btn.disabled = false; btn.textContent = "最新に更新"; } function poll() { fetchMonitor(); setTimeout(function() { if(isNewerUpdatedAt(lastUpdatedAt, before)) { finish(true); return; } if(Date.now() - startedAt >= REFRESH_TIMEOUT_MS) { finish(false); return; } poll(); }, REFRESH_POLL_MS); } fetch(REFRESH_URL, {method: "POST"}).then(function(r) { if(!r.ok) throw new Error("refresh failed"); poll(); }).catch(function() { if(status) status.textContent = "更新できませんでした"; refreshing = false; btn.disabled = false; btn.textContent = "最新に更新"; }); } $("refresh-btn").addEventListener("click", requestRefresh);
  tickClock(); updateAnalog(); buildCal(); fetchHolidays(); fetchWeather(); fetchMonitor(); initWallpaper(); initBattery();
  var wpTimer = null;
  function wpRestartTimer(){
    if (wpTimer) clearInterval(wpTimer);
    wpTimer = setInterval(function(){ if (wpList.length > 1) wpShow(wpIdx + 1); }, 5 * 60 * 1000);
  }
  wpRestartTimer();
  $("wp-next").addEventListener("click", function(){
    if (wpList.length < 2) return;
    wpOff = false;
    wpShow(wpIdx + 1);
    wpRestartTimer();
  });
  setInterval(initWallpaper, 60 * 60 * 1000);
  scheduleClock();
  setInterval(updateAnalog, 100);
  setInterval(buildCal, 60000);
  setInterval(fetchHolidays, 24 * 60 * 60 * 1000);
  setInterval(fetchWeather, 15 * 60 * 1000);
  setInterval(fetchMonitor, 5 * 60 * 1000);
  setInterval(pixelShift, 60 * 1000);
})();
</script>
</body>
</html>
